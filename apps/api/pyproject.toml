[project]
name = "soulcurve-api"
version = "0.1.0"
description = "SoulCurve backend: serves win-probability predictions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "itsdangerous",
    # "soulcurve-model @ git+https://github.com/SoulCurve/soulcurve-model@v0.1.0",  # M4'te eklenecek
]

[dependency-groups]
dev = [
    "pytest",
    "respx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soulcurve_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
